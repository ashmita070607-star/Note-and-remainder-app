<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Notes & Reminders</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <!-- Interactive Background Canvas -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- Glowing Custom Cursor -->
    <div class="cursor-follower" id="cursorFollower"></div>

    <div class="login-container">
        <div class="login-box 3d-card">
            <div class="glare"></div>

            <!-- Animated Logo -->
            <div class="login-logo">
                📝
            </div>

            <!-- Animated Letter Title -->
            <h1 class="animated-title" id="registerTitle">Create Account</h1>

            <p class="login-subtitle">
                Start organizing your notes and reminders
            </p>

            <form onsubmit="registerUser(event)">
                <label>Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

                <label>Username</label>
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose a username"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button
                    type="submit"
                    class="login-btn magnetic-btn"
                >
                    Create Account
                </button>
            </form>

            <p id="registerMessage" class="login-message"></p>

            <p class="register-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
